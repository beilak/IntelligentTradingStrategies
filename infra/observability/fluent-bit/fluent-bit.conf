[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  5
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        its_json
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name   modify
    Match  docker.*
    Add    environment ${OBSERVABILITY_ENVIRONMENT}

[OUTPUT]
    Name               opensearch
    Match              docker.*
    Host               opensearch
    Port               9200
    Index              its-app-logs
    Logstash_Format    On
    Logstash_Prefix    its-app-logs
    Suppress_Type_Name On
    Retry_Limit        False
