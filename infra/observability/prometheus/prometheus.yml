global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: its-fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - data-backend:8000
          - strategy-backend:8000
          - ga-backend:8000
          - execution-backend:8000
          - tech-system-backend:8000
          - event-log-backend:8000
        labels:
          environment: dev

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: event-log-postgres
    static_configs:
      - targets: ["event-log-postgres-exporter:9187"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: fluent-bit
    static_configs:
      - targets: ["fluent-bit:2020"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
