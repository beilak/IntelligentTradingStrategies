events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    # Increase various timeouts so UI and Nginx will allow long-running
    # proxied requests to complete. Default proxy timeouts are often 60s
    # which caused client-visible timeouts for long backend operations.
    # We keep a reasonable connect timeout but allow long read/send time
    # for backend responses.
    keepalive_timeout 3600;
    proxy_connect_timeout 60;
    proxy_send_timeout 3600;
    proxy_read_timeout 3600;
    # Also increase client-side timeouts to avoid Nginx closing idle
    # connections while the backend is working.
    client_header_timeout 3600;
    client_body_timeout 3600;
    send_timeout 3600;

    upstream data_backend {
        server data-backend:8000;
    }

    upstream data_ui {
        server data-ui:80;
    }

    upstream strategy_backend {
        server strategy-backend:8000;
    }

    upstream strategy_ui {
        server strategy-ui:80;
    }

    upstream ga_backend {
        server ga-backend:8000;
    }

    upstream ga_ui {
        server ga-ui:80;
    }

    upstream execution_backend {
        server execution-backend:8000;
    }

    upstream execution_ui {
        server execution-ui:80;
    }

    upstream launchpad_ui {
        server launchpad-ui:80;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream tech_system_backend {
        server tech-system-backend:8000;
    }

    upstream event_log_backend {
        server event-log-backend:8000;
    }

    upstream tech_system_ui {
        server tech-system-ui:80;
    }

    server {
        listen 80;
        server_name _;

        location = / {
            return 302 $scheme://$http_host/launchpad/;
        }

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /docs {
            return 302 $scheme://$http_host/docs/;
        }

        location = /docs/ {
            root /usr/share/nginx/html;
            try_files /docs/index.html =404;
        }

        location ~ ^/docs/raw/((?:en/)?[A-Za-z0-9_.-]+\.md)$ {
            alias /usr/share/nginx/html/docs/$1;
            default_type text/markdown;
            charset_types text/markdown;
            charset utf-8;
        }

        location ~ ^/docs/([A-Za-z0-9_.-]+\.md)$ {
            return 302 $scheme://$http_host/docs/?file=$1;
        }

        location /docs/pdf/ {
            root /usr/share/nginx/html;
            default_type application/pdf;
            add_header Content-Disposition "attachment";
            try_files $uri =404;
        }

        location /docs/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location /api/data/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://data_backend/api/v1/;
        }

        location /api/v1/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://data_backend/api/v1/;
        }

        location /api/strategies/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://strategy_backend/api/v1/;
        }

        location /api/ga/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://ga_backend/api/v1/;
        }

        location /api/execution/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_pass http://execution_backend/api/v1/;
        }

        location /api/tech/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tech_system_backend/api/v1/;
        }

        location /api/event-log/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://event_log_backend/api/v1/;
        }

        location /data/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://data_ui/;
        }

        location /strategies/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://strategy_ui/;
        }

        location /ga/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://ga_ui/;
        }

        location /execution/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://execution_ui/;
        }

        location /tech/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://tech_system_ui/;
        }

        location /launchpad/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://launchpad_ui/;
        }
    }
}
